[tool.pytest.ini_options]
testpaths = ["tests/v3"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["v3.offline"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.mypy]
python_version = "3.12"
strict = true
files = ["v3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
